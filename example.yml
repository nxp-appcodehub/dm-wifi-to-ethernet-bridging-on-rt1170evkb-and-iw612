    - -armgcc@release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@sdram_debug
    - -mdk@sdram_release
  contents:
    document:
      brief: wifi_cli
      category: wifi_examples
