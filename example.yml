      - ${board_root}/${board}/examples_shared_readme.md
      name: wifi_cli${core_id_suffix_name}
    meta_path: examples/wifi_examples/wifi_cli
    project-root-path: boards/${board}/wifi_examples/wifi_cli/${multicore_foldername}
